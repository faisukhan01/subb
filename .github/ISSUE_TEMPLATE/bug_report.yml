name: 🐞 Bug report
description: Something in SUBB SURFERS is broken or behaves unexpectedly.
title: "[bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in the details
        below so we can reproduce it quickly.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web game (src/)
        - Web UI / pages
        - leaderboard-go
        - ml-python
        - tournament-java
        - anticheat-csharp
        - Flutter app (mobile/flutter_app)
        - Android native app (mobile/android-native)
        - Unity project
        - Unreal project
        - Infra / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
      placeholder: Tell us what you saw!
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the game …
        2. Tap …
        3. See error
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Always
        - Sometimes (roughly 1 in 2–10 attempts)
        - Rarely (hard to reproduce)
        - Happened once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      description: Console output, server logs, CI logs — anything relevant.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Chrome 131 / Android 15 / Unity 2022.3.52f1 / commit SHA

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues before opening this one
          required: true
