; SUBB SURFERS — minimal engine configuration.
; The full file is regenerated by the editor on first launch; these are the
; settings the project actually depends on out of the box.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/SubbSurfers.EndlessGameMode
GameDefaultMap=/Engine/Maps/Templates/Template_Default

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Mobile
AppliedTargetedHardwareClass=Mobile
DefaultGraphicsPerformance=Scalable
AppliedDefaultGraphicsPerformance=Scalable

[/Script/Engine.RendererSettings]
r.Mobile.EnableStaticAndCastedShadowCastingFromStationaryLight=False
r.Shadow.UnbuiltPreviewInGame=False

[/Script/Engine.Engine]
bSmoothFrameRate=True

[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="TrackSurface")
