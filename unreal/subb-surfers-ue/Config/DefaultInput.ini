; SUBB SURFERS — Enhanced Input defaults.
; The character binds UInputMappingContext / UInputAction assets in the editor
; (ASurferCharacter::DefaultMappingContext, IA_MoveLane, IA_Jump, IA_Roll);
; these settings make Enhanced Input the default player input classes.

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableUserSettings=True
bEnableDefaultMappingContexts=True

[/Script/Engine.InputSettings]
bEnableLegacyInputScales=False
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently
DefaultViewportMouseLockMode=LockOnCapture
