# SUBB SURFERS — edge gateway.
# One entry point for the web build and every backend service, with prefixes
# stripped for the APIs so each service keeps clean, framework-native routes.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 2m;

    # --- compression -----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # --- upstreams ---------------------------------------------------------
    upstream subb_web    { server web:3000;    keepalive 32; }
    upstream subb_go     { server go:4001;     keepalive 8; }
    upstream subb_python { server python:4002; keepalive 8; }
    upstream subb_java   { server java:4003;   keepalive 8; }
    upstream subb_csharp { server csharp:4004; keepalive 8; }

    # Shared proxy behaviour: pass the original request through and keep
    # WebSockets working for the web tier.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # ------------------------------------------------ leaderboard (go)
        # /api/go/* → go:4001 with the /api/go prefix stripped.
        location /api/go/ {
            rewrite ^/api/go/(.*)$ /$1 break;
            proxy_pass http://subb_go;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ------------------------------------------------ difficulty (python)
        location /api/ml/ {
            rewrite ^/api/ml/(.*)$ /$1 break;
            proxy_pass http://subb_python;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ------------------------------------------------- tournaments (java)
        location /api/tournaments/ {
            rewrite ^/api/tournaments/(.*)$ /$1 break;
            proxy_pass http://subb_java;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ------------------------------------------------- anticheat (csharp)
        location /api/anticheat/ {
            rewrite ^/api/anticheat/(.*)$ /$1 break;
            proxy_pass http://subb_csharp;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ----------------------------------------- liveness of the gateway
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ------------------------------------------------------ web (Next.js)
        # Everything else — game page, static assets, its own /api/* routes —
        # goes to the Next.js standalone server.
        location / {
            proxy_pass http://subb_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout    75s;
        }
    }
}
